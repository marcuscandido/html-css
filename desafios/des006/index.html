<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 6 - Title</title>
</head>
<body>
<h2>Tags em HTML</h1>
<p>
    Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse
    sobre os termos para descobrir qual tag deverá utilizar em cada caso.
</p>
<ul>
<li><abbr title="Use a tag <p>">Parágrafo</abbr></li>
<li><abbr title="Use a tag <h1> a <h6>">Títulos</abbr></li>
<li><abbr title="Use a tag <img>">Imagens</abbr></li>
<li><abbr title="Use a tag <abbr>">Abreviações</abbr></li>
<li><abbr title="Use a tag <code>">Códigos-fonte</abbr></li>
<li><abbr title="Use a tag <ol> e a <li> para as linhas">Listas Numeradas</abbr></li>
<li><abbr title="Use a tag <ul> e a <li> para as linhas">Listas com Demarcadores</abbr></li>
</ul>
</body>
</html>
