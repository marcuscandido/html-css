<h1>Midias em Diferentes tamanhos</h1>
<p>Tente abrir esse site em diferentes dispositivos ou tamanhos de janelas</p>
<picture>
    <source media="(max-width: 750px)" srcset="imagens/imagem-p.png" type="image/png">
    <source media="(max-width: 1050px)" srcset="imagens/imagem-m.png" type="image/png">
    <img src="imagens/imagem-g.png" alt="imagem-full">
</picture>

<h1>Reproduzindo audios</h1>
<p>Escute o Podcast</p>
<audio preload="metadata" controls autoplay loop>
    <source src="midia/guanacast-33.mp3" type="audio/mpeg">
    <source src="midia/guanacast-33.ogg" type="audio/ogg">
    <source src="midia/guanacast-33.wav" type="audio/ogg">
    <p>O seu navegador não suporta os formatos de audio, baixe ele por este<a href="midia/guanacast-33.mp3" download="guanacast-33.mp3" type="audio/mpeg">link</a></p>
</audio>
