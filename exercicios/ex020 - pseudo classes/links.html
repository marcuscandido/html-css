<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /* 
        
        # - id
        . - class
        : - pseudo-class
        :: - pseudo-element
        > - children
    
        */
        body{
            font-family: Arial, Helvetica, sans-serif
        }

        a {
            color: aqua;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:visited{
            color: blue;
        }

        a:hover:visited {
            text-decoration: underline;
        }

        a:active{
            color: aquamarine;
        }
        
    </style>
</head>
<body>
    <ul>
        <li><a target="_blank" href="https://github.com/gustavoguanabara">Página do Github</a></li>
        <li><a target="_blank" href="https://www.youtube.com/c/CursoemV%C3%ADdeo">Canal do Youtube</a></li>
        <li><a target="_blank" href="https://www.cursoemvideo.com/">Site no Google</a></li>
    </ul>
</body>
</html>
